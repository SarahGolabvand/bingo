{% load i18n %}
<div
  x-cloak
  x-show="active"
  x-transition.opacity
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/65 p-4"
  @click.self="active=null"
>
  <section
    x-trap.inert.noscroll="active !== null"
    role="dialog"
    aria-modal="true"
    aria-labelledby="item-title"
    class="panel max-h-[90dvh] w-full max-w-md overflow-y-auto"
  >
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="eyebrow">{% trans 'Make it yours' %}</p>
        <h2
          id="item-title"
          class="mt-3 text-2xl font-semibold"
          x-text="active?.name"
        ></h2>
      </div>
      <button
        class="btn-secondary px-4"
        @click="active=null"
        aria-label="{% trans 'Close dialog' %}"
      >
        ×
      </button>
    </div>
    <fieldset class="mt-7">
      <legend class="mb-3 text-sm font-semibold">
        {% trans 'Milk selection' %}
      </legend>
      <label
        class="mb-2 flex items-center justify-between rounded-xl border border-line p-3"
        ><span
          ><input
            type="radio"
            name="milk"
            value="regular"
            x-model="milk"
            class="me-2 accent-teal-500"
          />{% trans 'Whole milk' %}</span
        ><span class="text-xs text-muted">{% trans 'Included' %}</span></label
      ><label
        class="flex items-center justify-between rounded-xl border border-line p-3"
        ><span
          ><input
            type="radio"
            name="milk"
            value="oat"
            x-model="milk"
            class="me-2 accent-teal-500"
          />{% trans 'Oat milk' %}</span
        ><span class="text-xs text-muted">+$0.80</span></label
      >
    </fieldset>
    <label class="my-5 flex items-center justify-between"
      ><span
        ><input type="checkbox" x-model="shot" class="me-2 accent-teal-500" />{%
        trans 'Extra espresso shot' %}</span
      ><span class="text-sm text-muted">+$1.00</span></label
    ><label class="mb-2 block text-sm" for="sweetness"
      >{% trans 'Sweetness' %}</label
    ><select id="sweetness" class="field" x-model="sweetness">
      <option value="none">{% trans 'Unsweetened' %}</option>
      <option value="normal">{% trans 'Regular' %}</option>
      <option value="extra">{% trans 'Extra sweet' %}</option>
    </select>
    <div class="my-6 flex items-center justify-between">
      <label for="quantity">{% trans 'Quantity' %}</label
      ><input
        id="quantity"
        class="field w-24"
        type="number"
        min="1"
        max="20"
        x-model.number="quantity"
      />
    </div>
    <button
      class="btn-primary w-full justify-between"
      :disabled="!Number.isInteger(quantity)||quantity<1||quantity>20||items.length>=50"
      @click="add()"
    >
      <span>{% trans 'Add to Cart' %}</span
      ><span
        class="min-w-20 text-end tabular-nums"
        x-text="money(unit*quantity)"
      ></span>
    </button>
  </section>
</div>
